<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Screen Video With Quote</title>
<link rel="stylesheet" href="styles.css"><!-- Link to the external CSS file -->
</head>
<body>
	<!-- Full-screen video element -->
<video autoplay loop muted class="background-video"> <!-- Video will play automatically, loop, and be muted -->
<source src="videos/hedgehogs_compress copy.mp4" type="video/mp4"> <!-- Path to the video file -->
Your browser does not support the video tag. <!-- Fallback message for unsupported browsers -->
	</video>
	<!-- Centered text box with quote -->
<div class="text-box">
<p>"It's easy to do nothing, it's hard to forgive" - Aang </p> <!-- Text of the quote -->
</div>
</body>
</html>
